name: samryong CI/CD with Gradle

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3

      ## Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      ## Gradle caching
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      ## Start services with Docker Compose
      - name: Start MongoDB, Elasticsearch, and Kibana
        run: docker compose up -d mongodb es kibana
        shell: bash

      ## Wait for Elasticsearch to be ready
      - name: Wait for Elasticsearch to start
        run: |
          until curl -s http://localhost:9200 >/dev/null; do
            echo "Waiting for Elasticsearch to start..."
            sleep 5
          done
        shell: bash

      ## Generate application-server.yml file
      - name: Create application-server.yml file
        run: |
          cd ./src/main/resources
          touch ./application-server.yml
          echo "${{ secrets.PROPERTIES }}" > ./application-server.yml
        shell: bash

      ## Grant permissions for Gradle build
      - name: Grant permissions for Gradle build
        run: chmod +x gradlew

      ## Build with Gradle
      - name: Running Gradle build
        run: ./gradlew build
        shell: bash

      ## Build Docker image and push to Docker Hub
      - name: Docker image build and push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/samryong .
          docker push ${{ secrets.DOCKER_USERNAME }}/samryong

      ## Deploy to production
      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          username: ${{ secrets.EC2_USERNAME }}
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: GITHUB_SHA
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/samryong
            sudo docker rm -f $(docker ps -qa) 
            docker compose up -d
            docker image prune -f
