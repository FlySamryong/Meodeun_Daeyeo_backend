name: samryong CI/CD with Gradle

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-20.04
    services:
      # 필요한 서비스 정의 (예: Elasticsearch, Redis)
      docker:
        image: docker:20.10.7
        options: --privileged # Docker 내부에서 Docker를 실행할 수 있도록 설정
    steps:
      - uses: actions/checkout@v3

      ## Docker Compose 파일로 서비스 시작
      - name: Start Docker Compose services
        run: |
          docker-compose -f docker-compose.yml up -d
        shell: bash

      ## JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      ## Gradle 캐시
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      ## application-server.yml 생성
      - name: Create application-server.yml
        run: |
          cd ./src/main/resources
          touch ./application-server.yml
          echo "${{ secrets.PROPERTIES }}" > ./application-server.yml
        shell: bash

      ## Gradle 빌드 권한 설정
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      ## Gradle 빌드 (테스트 제외)
      - name: Run Gradle build
        run: ./gradlew clean build -x test
        shell: bash

      ## Docker 이미지 빌드 후 Docker Hub에 푸시
      - name: Build Docker image and push to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/samryong .
          docker push ${{ secrets.DOCKER_USERNAME }}/samryong

      ## Docker Hub에서 Pull 후 배포
      - name: Pull from Docker Hub and deploy
        uses: appleboy/ssh-action@master
        with:
          username: ${{ secrets.EC2_USERNAME }}
          host: ${{ secrets.EC2_HOST }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/samryong
            sudo docker rm -f $(docker ps -qa)
            docker compose up -d
            docker image prune -f
